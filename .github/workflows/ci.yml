name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes: no crates.io release, no Marketplace publish,
# no tags. Packaging steps only verify that artifacts build.
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Example smoke
        run: |
          cargo run --quiet -- examples/hello.lucc
          cargo run --quiet -- examples/errors.lucc

  scripts:
    name: Install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Syntax check (bash)
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh
      - name: Syntax check (PowerShell)
        shell: pwsh
        run: >
          $errors = $null;
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/install.ps1', [ref]$null, [ref]$errors
          );
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Install from checkout (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/luca-cargo"
          mkdir -p "$CARGO_HOME/bin"
          export PATH="$CARGO_HOME/bin:$PATH"
          bash scripts/install.sh
          luca --version
          printf 'print("Hello, Luca!")\n' > /tmp/ci-hello.lucc
          luca /tmp/ci-hello.lucc
      - name: Install from checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_HOME = "$env:RUNNER_TEMP\luca-cargo"
          $env:Path = "$env:CARGO_HOME\bin;$env:Path"
          .\scripts\install.ps1
          luca --version
          "print(""Hello, Luca!"")" | Out-File "$env:RUNNER_TEMP\ci-hello.lucc"
          luca "$env:RUNNER_TEMP\ci-hello.lucc"

  extension:
    name: VS Code extension (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (no dependencies)
        run: npm test
      - name: Package (.vsix)
        run: npx -y @vscode/vsce package
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: luca-code-vsix
          path: editors/vscode/*.vsix

  wasm:
    name: WASM host spike (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Library compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown --lib
      - name: Build WASM host artifact
        working-directory: wasm-host
        run: cargo build --target wasm32-unknown-unknown
      - name: Host lint (deny warnings)
        working-directory: wasm-host
        run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node integration against the real artifact
        working-directory: wasm-host
        run: node --test smoke.mjs
